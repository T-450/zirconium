<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">Zirconium — color with a working purpose</title>
  <desc id="desc">Graphite editorial banner with color-coded Zig code and a band of light and dark palette colors.</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern></defs>
  <rect width="1440" height="640" fill="#161616"/><rect width="1440" height="640" fill="url(#grid)"/>
  <path d="M0 5h1440" stroke="#dca65b" stroke-width="10"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="82" y="92" fill="#dca65b" font-size="17" letter-spacing="4">Z / 040    ·    THE WORKING PALETTE</text>
    <text x="82" y="233" fill="#f1efe9" font-size="92" font-weight="700" letter-spacing="-8">ZIRCONIUM</text>
    <text x="85" y="292" fill="#b2b2a1" font-size="26">Color with a working purpose.</text>
    <text x="85" y="378" fill="#92928b" font-size="17">ONE LANGUAGE  /  TWO LIGHT CONDITIONS  /  FOUR PLACES TO WORK</text>
    <text x="85" y="489" fill="#bebaff" font-size="20">fn <tspan fill="#d9d9d3">make</tspan><tspan fill="#8ca8ff">(workspace)</tspan> <tspan fill="#ff9b79">-&gt;</tspan> <tspan fill="#7ce89a">clarity</tspan></text>
    <text x="85" y="555" fill="#b2b2a1" font-size="17">NEOVIM    ALACRITTY    FOOT    KITTY</text>
  </g>
  <g transform="translate(1090 120)"><rect width="270" height="365" rx="12" fill="#242424" stroke="#444444"/><path d="M0 49h270" stroke="#444444"/><circle cx="22" cy="24" r="5" fill="#ff9996"/><circle cx="43" cy="24" r="5" fill="#e5bd71"/><circle cx="64" cy="24" r="5" fill="#7ce89a"/>
    <path d="M24 100h154M24 141h209M24 182h123M24 223h185M24 264h146M24 305h216" stroke="#444444" stroke-width="12" stroke-linecap="round"/>
